services:
  - type: web
    name: quiz-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-web-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
databases:
  - name: quiz-web-db
    databaseName: quiz_web
    user: quiz_web
    region: singapore
    plan: basic-256mb
